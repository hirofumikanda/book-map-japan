<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>書店マップ | book-map-japan</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      /* チェーン絞り込みプルダウン。MapLibre のコントロールと同じ見え方に揃える。 */
      .chain-filter-ctrl {
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 0 0 2px rgb(0 0 0 / 10%);
        padding: 4px;
      }

      .chain-filter-ctrl select {
        appearance: auto;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 3px;
        color: #333;
        font-size: 14px;
        /* スマートフォンでの操作時に自動ズームさせないため、タップ領域を十分に取る */
        min-height: 32px;
        padding: 4px 6px;
      }

      /* 支援技術にのみ読ませるラベル。 */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
